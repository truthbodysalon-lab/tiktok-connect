<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整体院トゥルース｜TikTok連携</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222;line-height:1.7}h1{font-size:22px}.btn{display:inline-block;background:#1e783a;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-size:16px}#log{background:#f5f5f3;padding:12px;border-radius:8px;min-height:48px;white-space:pre-wrap;word-break:break-all}footer{margin-top:40px;font-size:13px;color:#666}</style></head>
<body><h1>整体院トゥルース｜TikTok連携（Truth Body Salon Poster）</h1>
<p>整体院トゥルース（新潟県長岡市）が、自院のTikTokアカウント <b>@truth.body.salon</b> に肩こり・頭痛のセルフケア動画を投稿するための連携ページです。</p>
<ol><li>「TikTokでログイン」を押して連携を許可</li><li>許可後にこのページへ戻ると連携コードが表示され、投稿ツールが動画を投稿します</li></ol>
<p><a id="auth" class="btn" href="#">TikTokでログイン</a></p>
<h3>状態</h3><div id="log">未連携</div>
<script>
const CK=new URLSearchParams(location.search).get("ck")||localStorage.getItem("ck")||"awahgdaue30w0igv";if(new URLSearchParams(location.search).get("ck"))localStorage.setItem("ck",CK);const RU=location.origin+location.pathname.replace(/[^/]*$/,'');
const log=m=>document.getElementById('log').textContent=m;
function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
document.getElementById('auth').onclick=async e=>{e.preventDefault();const v=b64(crypto.getRandomValues(new Uint8Array(48)));sessionStorage.setItem('v',v);const st=b64(crypto.getRandomValues(new Uint8Array(8)));sessionStorage.setItem('s',st);
const q=new URLSearchParams({client_key:CK,response_type:'code',scope:'user.info.basic,video.publish,video.upload',redirect_uri:RU,state:st,code_challenge:await sha256hex(v),code_challenge_method:'S256'});location.href='https://www.tiktok.com/v2/auth/authorize/?'+q;};
const q=new URLSearchParams(location.search);
if(q.get('code')){log('連携が許可されました。\n連携コード: '+q.get('code')+'\ncode_verifier: '+(sessionStorage.getItem('v')||'')+'\n\nこの画面の内容を投稿ツールに渡すと、動画がTikTokに投稿されます。');}
else if(q.get('error')){log('連携できませんでした: '+q.get('error_description'));}
</script>
